<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · dbgraph</title>
	<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/app.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">LOCAL KNOWLEDGE GRAPH</p>
    <h1>Sign in to dbgraph</h1>
    <p class="muted">Use the high-entropy Web token configured for your role. The token is exchanged for a secure server-side session and is never stored by this page.</p>
    <form id="login-form" autocomplete="off">
      <label for="login-token">Access token</label>
      <input id="login-token" name="token" type="password" required autofocus autocomplete="off">
      <button type="submit">Sign in</button>
    </form>
    <p id="login-message" class="message" role="status"></p>
  </main>
</body>
</html>
